# Every merge into main publishes a new ai-garcon patch release to npm.
#
# The version is not stored in the repository: the next one is the highest of the latest
# v* tag and the version on npm, plus one on the patch. A merge whose message contains
# [minor] or [major] bumps that part instead.
#
# Two jobs keep the build away from the credentials. `build` installs the dashboard's npm
# dependencies, runs the tests and the Go cross-builds with a read-only token and no OIDC
# identity, and hands over one tarball. `publish` installs and runs nothing from npm: it
# publishes that tarball with provenance, tags the commit and creates the GitHub release,
# so the tag, npm and the version the dashboard shows always agree.
#
# Publishing uses npm trusted publishing (OIDC): npmjs.com > ai-garcon > Settings >
# Trusted Publisher must list this repository and this file name. No npm token is stored.
# Actions are pinned to commits; the comment names the release each commit is.
name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags decide the next version
          persist-credentials: false
      - name: Toolchain versions from .mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - name: Next version
        id: version
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          published=$(npm view ai-garcon version 2>/dev/null || echo 0.0.0)
          base=$(printf '%s\n%s\n' "${tag#v}" "$published" | sort -V | tail -n1)
          IFS=. read -r major minor patch <<<"$base"
          message=$(git log -1 --pretty=%B)
          case "$message" in
            *"[major]"*) next="$((major + 1)).0.0" ;;
            *"[minor]"*) next="$major.$((minor + 1)).0" ;;
            *) next="$major.$minor.$((patch + 1))" ;;
          esac
          # Tag names and npm output reach the shells below only as this checked number.
          [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "computed version '$next' is not X.Y.Z" >&2; exit 1; }
          echo "last tag ${tag:-none}, npm $published, next $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Test, build and pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release.sh "$VERSION" --pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: npm/ai-garcon/ai-garcon-*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag, create the GitHub release
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain versions from .mise.toml
        id: tools
        run: echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish the packed tarball
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm publish --provenance --access public "./ai-garcon-$VERSION.tgz"
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="v$VERSION"
          git tag "$v"
          git push origin "$v"
          gh release create "$v" --title "$v" --generate-notes "./ai-garcon-$VERSION.tgz"
