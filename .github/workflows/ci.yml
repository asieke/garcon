# Pull requests get the exact build a release runs, with a read-only token and nothing
# published: dashboard check and build, Go tests, npm shim tests, the four cross-builds
# and a dry-run pack. Actions are pinned to commits; the comment names the release.
name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain versions from .mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - run: scripts/release.sh 9.9.9 --dry-run
