# Pull requests get the exact build a release runs, with a read-only token and nothing
# published: secret scan of new commits, scripts/check.sh (repository boundaries, dashboard
# check and build, Go tests, npm shim tests), then the four cross-builds and a dry-run pack.
# Actions are pinned to commits; the comment names the release. Branch protection requires
# the `check` job (asieke/workspace scripts/configure-github.sh).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans every commit introduced by the PR or push. Old history is not rescanned.
      # Put false positives in .gitleaksignore; never remove this step.
      - name: Scan new commits for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c --quiet
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range=HEAD
          else
            range="${BASE}..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$range" .
      - name: Toolchain versions from .mise.toml
        id: tools
        run: |
          echo "go=$(sed -n 's/^go = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^node = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.tools.outputs.node }}
      - run: scripts/check.sh
      - run: scripts/release.sh 9.9.9 --dry-run
